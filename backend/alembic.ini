# ══════════════════════════════════════════════════════════════
# RadAssist AI — Alembic Configuration
# ══════════════════════════════════════════════════════════════
#
#   alembic revision --autogenerate -m "add medical_images"
#   alembic upgrade head
#   alembic current
#   alembic history
#
# NOTE: sqlalchemy.url is deliberately blank. The real value comes from
# DATABASE_URL via app.config in env.py, so migrations always target the same
# database the application uses — no second source of truth to drift.
# ══════════════════════════════════════════════════════════════

[alembic]
script_location = alembic

# Timestamped, readable revision filenames: 20260811_1430_add_medical_images.py
# Alembic's default is a bare hash, which tells you nothing in a file listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

prepend_sys_path = .
timezone = UTC

# Set from DATABASE_URL in env.py — see note above.
sqlalchemy.url =


[post_write_hooks]
# None configured. Autogenerated migrations should be reviewed by hand
# anyway — Alembic cannot infer intent for renames or data migrations.


# ══════════════════════════════════════════════════════════════
# Logging
# ══════════════════════════════════════════════════════════════

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
