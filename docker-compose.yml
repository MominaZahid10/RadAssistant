# ══════════════════════════════════════════════════════════════
# RadAssist AI — Docker Compose (Development)
# ══════════════════════════════════════════════════════════════
#
# WHAT IS DOCKER COMPOSE?
# A file that defines MULTIPLE Docker containers and how they
# connect. Instead of running 4 separate commands, you run:
#   docker-compose up
# and ALL services start together on a shared network.
#
# HOW SERVICES TALK TO EACH OTHER:
# Docker creates a virtual network. Each service can reach
# others by NAME. For example, the backend reaches PostgreSQL
# at hostname "postgres" (not localhost). That's why our
# DATABASE_URL uses "postgres" as the host.
#
# VOLUMES:
# Volumes persist data. Without them, your database data
# disappears every time you restart the containers.
#
# TO START:  docker-compose up --build
# TO STOP:   docker-compose down
# TO RESET:  docker-compose down -v  (WARNING: deletes all data)
# ══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ──────────────────────────────────
  # Stores: users, cases, reports, audit logs (structured data)
  postgres:
    image: postgres:16-alpine      # Official Postgres, Alpine = smaller
    container_name: radassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radassist
      POSTGRES_PASSWORD: radassist_secret
      POSTGRES_DB: radassist_db
    ports:
      - "5433:5432"                # Access from your machine at localhost:5433 (5432 may be used by local Postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radassist -d radassist_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector Database ──────────────────────────────
  # Stores: document embeddings for semantic search (RAG retrieval)
  # Dashboard: http://localhost:6333/dashboard
  qdrant:
    # PINNED, not :latest — the Python client (qdrant-client==1.10.0) and the
    # server share a wire protocol. Letting the server float to :latest means
    # a future release can break your app with no code change on your side.
    # Upgrade both together, deliberately.
    image: qdrant/qdrant:v1.10.1
    container_name: radassist-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"                # REST API
      - "6334:6334"                # gRPC (faster, used in production)
    volumes:
      - qdrant_data:/qdrant/storage  # Persist vector data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ─────────────────────────────────────
  # The API server — handles all business logic & AI orchestration
  # Swagger docs: http://localhost:8000/docs
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radassist-backend
    restart: unless-stopped
    # ⚠️  WAIT FOR POSTGRES, THEN MIGRATE, THEN SERVE — see backend/start.sh.
    # This was `alembic upgrade head && uvicorn ...` inline. On a MACHINE
    # REBOOT that fails: `depends_on: condition: service_healthy` below only
    # orders `docker compose up`, not the daemon's own restart of
    # `restart: unless-stopped` containers. Postgres and the backend race,
    # alembic hits "the database system is starting up", the && chain breaks,
    # and the container exits — taking the 8000 port mapping with it.
    command: sh /app/start.sh
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env           # API keys and everything else
    environment:
      # These override .env so the container always uses Docker hostnames,
      # even if .env was edited for running the backend outside Docker.
      - DATABASE_URL=postgresql+asyncpg://radassist:radassist_secret@postgres:5432/radassist_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DEBUG=true
      - UPLOAD_DIR=/app/uploads
      - IMAGE_DIR=/app/images
      # Python block-buffers stdout when it isn't a TTY, so print() output sits
      # in a buffer while uvicorn's logger (which writes immediately) appears
      # first. The result is a log where startup messages show up late or out
      # of order — which made the app look hung on several occasions when it
      # had actually started fine.
      - PYTHONUNBUFFERED=1
      # ── Load the embedding model from cache, don't phone home ──
      # sentence-transformers checks HuggingFace for model updates on every
      # startup. If HF is unreachable (offline, flaky DNS, corporate proxy) it
      # retries 5x per file with backoff — roughly a minute of stalling before
      # it gives up and uses the cached copy anyway. The result is a backend
      # that looks hung and refuses connections on a cold start.
      #
      # Offline mode skips the check entirely and loads straight from the
      # hf_cache volume: startup becomes fast and deterministic, and the app
      # no longer has a runtime dependency on huggingface.co being up.
      #
      # ⚠️  Set to 0 the FIRST time you use a new EMBEDDING_MODEL, so it can
      # actually be downloaded. Then set it back to 1.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${HF_HUB_OFFLINE:-1}
      # Default socket timeout is 10s, which is too aggressive on an unstable
      # link — a connection that takes 7s to establish gets killed mid-download
      # and the whole retry ladder restarts. Only relevant when
      # HF_HUB_OFFLINE=0, i.e. the one time you populate the cache.
      - HF_HUB_DOWNLOAD_TIMEOUT=60
      - HF_HUB_ETAG_TIMEOUT=30
      # Toggleable so the reranker can be A/B tested against vector-only
      # retrieval on the SAME code path:
      #   RERANK_ENABLED=false docker-compose up -d backend   → baseline
      #   RERANK_ENABLED=true  docker-compose up -d backend   → reranked
      - RERANK_ENABLED=${RERANK_ENABLED:-true}
      # Retrieval tuning knobs — sweep these against eval/run_eval.py
      - RERANK_CANDIDATES=${RERANK_CANDIDATES:-48}
      - RETRIEVAL_LIMIT=${RETRIEVAL_LIMIT:-12}
      - MAX_CHUNKS_PER_DOCUMENT=${MAX_CHUNKS_PER_DOCUMENT:-3}
      # Phase 4.5 — read report photos with a vision model instead of
      # Tesseract. Set false to A/B the two readers on the same upload path:
      #   VISION_ENABLED=false docker-compose up -d backend   → OCR only
      - VISION_ENABLED=${VISION_ENABLED:-true}
      # ⚠️  The only vision model Groq still serves; every alternative was
      # retired between Oct 2024 and Jul 2026. See app/config.py.
      - VISION_MODEL=${VISION_MODEL:-qwen/qwen3.6-27b}
    volumes:
      - ./backend:/app             # Mount code for hot reload
      - uploads_data:/app/uploads  # Named volume so uploads don't land in your source tree
      - images_data:/app/images    # Phase 4: image files (metadata stays in Postgres)
      # ⚠️  BIND MOUNT, NOT A NAMED VOLUME — ON PURPOSE.
      # This was a named volume, which `docker-compose down -v` destroys.
      # Combined with HF_HUB_OFFLINE=1 that produced an unrecoverable state:
      # the model was deleted, offline mode blocked re-downloading it, the
      # app started anyway (model load failure is caught, not fatal), and then
      # every ingestion silently failed — 34 documents, 0 chunks, no obvious
      # cause.
      #
      # A host bind mount survives `down -v`, so wiping the databases no
      # longer takes the model with it.
      - ./backend/.hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy  # Wait for DB to be ready
      qdrant:
        condition: service_healthy  # Wait for Qdrant to be ready

  # ── Next.js Frontend ────────────────────────────────────
  # The web UI — what the radiologist sees and interacts with
  # Dashboard: http://localhost:3000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radassist-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # ── Make hot reload work through the bind mount ──
      # Docker Desktop on Windows/macOS does NOT forward inotify filesystem
      # events from the host into the container. The bind mount shows the
      # updated file contents, but the watcher is never notified, so Next.js
      # keeps serving the previously compiled bundle — edits appear to do
      # nothing until you restart the container.
      #
      # Polling makes the watcher check timestamps on an interval instead of
      # waiting for events. It costs a little CPU; it's the standard trade for
      # Docker-on-Windows development.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
    volumes:
      - ./frontend/src:/app/src    # Mount src for hot reload
    depends_on:
      - backend                    # Start after backend is up

# ── Named Volumes ─────────────────────────────────────────
# These persist data between container restarts.
# Delete with: docker-compose down -v
volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  images_data:
